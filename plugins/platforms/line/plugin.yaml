name: line-platform
label: LINE
kind: platform
version: 1.0.0
description: Hermes Agent 的 LINE Messaging API 网关适配器。运行一个接收 LINE webhook 事件（具有 HMAC-SHA256
  签名验证）的 aiohttp webhook 服务器，并在 LINE 聊天（一对一、群组、房间）与 Hermes 代理之间中继消息。出站回复优先使用免费的回复令牌，当令牌过期或不存在时，回退到计费的
  Push API。慢速的 LLM 响应会弹出一个模板按钮回发气泡，以便用户在答案准备就绪后使用新的免费回复令牌获取答案。
author: Hermes Agent contributors
requires_env:
- name: LINE_CHANNEL_ACCESS_TOKEN
  description: LINE 频道长期访问令牌 (LINE Developers Console > Messaging API > Channel access
    token)
  prompt: LINE channel access token
  url: https://developers.line.biz/console/
  password: true
- name: LINE_CHANNEL_SECRET
  description: LINE 频道机密 (用于 HMAC-SHA256 webhook 签名验证)
  prompt: LINE channel secret
  url: https://developers.line.biz/console/
  password: true
optional_env:
- name: LINE_PORT
  description: 'Webhook 监听端口 (默认: 8646)'
  prompt: Webhook port
  password: false
- name: LINE_HOST
  description: 'Webhook 绑定主机 (默认: 0.0.0.0)'
  prompt: Webhook host
  password: false
- name: LINE_PUBLIC_URL
  description: 用于向 LINE 提供图像/音频/视频的公共 HTTPS 基本 URL。当绑定地址不可直接访问时，媒体发送需要此项。
  prompt: Public HTTPS base URL
  password: false
- name: LINE_ALLOWED_USERS
  description: 允许私信机器人的逗号分隔的 LINE 用户 ID (以 U 为前缀)
  prompt: Allowed user IDs (comma-separated)
  password: false
- name: LINE_ALLOWED_GROUPS
  description: 机器人将回复的逗号分隔的 LINE 群组 ID (以 C 为前缀)
  prompt: Allowed group IDs (comma-separated)
  password: false
- name: LINE_ALLOWED_ROOMS
  description: 机器人将回复的逗号分隔的 LINE 房间 ID (以 R 为前缀)
  prompt: Allowed room IDs (comma-separated)
  password: false
- name: LINE_ALLOW_ALL_USERS
  description: 允许任何 LINE 用户与机器人对话 (仅开发模式 — 禁用白名单)
  prompt: Allow all users? (true/false)
  password: false
- name: LINE_HOME_CHANNEL
  description: 定时任务/通知投递的默认用户/群组/房间 ID
  prompt: Home channel ID (or empty)
  password: false
- name: LINE_SLOW_RESPONSE_THRESHOLD
  description: '较慢的 LLM 回发按钮触发前的秒数 (默认: 45；设置为 0 禁用并始终使用 Push API 回退)'
  prompt: Slow response threshold (seconds)
  password: false
