name: google_chat-platform
label: Google Chat
kind: platform
version: 1.0.0
description: Hermes Agent 的 Google Chat 网关适配器。通过 Cloud Pub/Sub 拉取订阅连接处理入站事件，并使用 Google
  Chat REST API 发送出站消息 —— 与 Slack Socket Mode 或 Telegram 长轮询的体验相同，无需公共 URL。原生文件附件通过每用户
  OAuth 传递（每个用户在自己的私信中运行一次 /setup-files）。
author: Ramón Fernández
requires_env:
- name: GOOGLE_CHAT_PROJECT_ID
  description: 托管聊天事件的 Pub/Sub 主题的 GCP 项目 ID。回退到 GOOGLE_CLOUD_PROJECT。
  prompt: GCP project ID
  url: https://console.cloud.google.com/
  password: false
- name: GOOGLE_CHAT_SUBSCRIPTION_NAME
  description: 完整的 Pub/Sub 订阅路径：projects/<proj>/subscriptions/<sub>。旧别名：GOOGLE_CHAT_SUBSCRIPTION。
  prompt: Pub/Sub subscription name
  password: false
- name: GOOGLE_CHAT_SERVICE_ACCOUNT_JSON
  description: 服务帐户 JSON 密钥的路径 (或内联 JSON)。留空以便在 Cloud Run / GCE 上使用应用程序默认凭据。回退到 GOOGLE_APPLICATION_CREDENTIALS。
  prompt: Path to SA JSON (or empty for ADC)
  password: true
optional_env:
- name: GOOGLE_CHAT_ALLOWED_USERS
  description: 允许与机器人互动的逗号分隔的用户邮箱。
  prompt: Allowed user emails (comma-separated)
  password: false
- name: GOOGLE_CHAT_HOME_CHANNEL
  description: 定时任务/通知投递的默认空间 (例如 spaces/AAAA...).
  prompt: Home space ID (or empty)
  password: false
