name: irc-platform
label: IRC
kind: platform
version: 1.0.0
description: Hermes Agent 的 IRC 网关适配器。连接到 IRC 服务器，并在 IRC 频道（或私信）与 Hermes 代理之间中继消息。没有外部依赖
  —— 使用 Python 标准库 asyncio 实现 IRC 协议。
author: Nous Research
requires_env:
- name: IRC_SERVER
  description: IRC 服务器主机名 (例如 irc.libera.chat)
  prompt: IRC server
  password: false
- name: IRC_CHANNEL
  description: '要加入的频道（例如 #hermes — 多个用逗号分隔）'
  prompt: IRC channel
  password: false
- name: IRC_NICKNAME
  description: 'IRC 上的机器人昵称 (默认: hermes-bot)'
  prompt: Bot nickname
  password: false
optional_env:
- name: IRC_PORT
  description: 'IRC 服务器端口 (默认: 6697 含 TLS, 6667 不含)'
  prompt: IRC port
  password: false
- name: IRC_USE_TLS
  description: 为 IRC 连接使用 TLS (1/true/yes 启用，默认在端口 6697 启用)
  prompt: Use TLS? (true/false)
  password: false
- name: IRC_SERVER_PASSWORD
  description: IRC PASS 命令的服务器密码 (可选)
  prompt: Server password (optional)
  password: true
- name: IRC_NICKSERV_PASSWORD
  description: 用于连接时自动识别的 NickServ 密码 (可选)
  prompt: NickServ password (optional)
  password: true
- name: IRC_ALLOWED_USERS
  description: 允许与机器人对话的逗号分隔的 IRC 昵称
  prompt: Allowed nicks (comma-separated)
  password: false
- name: IRC_ALLOW_ALL_USERS
  description: 允许频道中的任何人与机器人对话 (仅开发模式)
  prompt: Allow all users? (true/false)
  password: false
- name: IRC_HOME_CHANNEL
  description: 定时任务/通知投递的频道（默认为 IRC_CHANNEL）
  prompt: Home channel (or empty)
  password: false
