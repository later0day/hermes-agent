name: simplex-platform
label: SimpleX Chat
kind: platform
version: 1.1.0
description: Hermes Agent 的 SimpleX Chat 网关适配器。通过 WebSocket 连接到本地 simplex-chat 守护进程，并在
  SimpleX 联系人/群组与 Hermes 代理之间中继消息。SimpleX 是去中心化的，并且不分配持久的用户 ID —— 每个联系人都是在连接时生成的不透明内部
  ID，使其成为最隐私的通讯工具之一。
author: Mibayy, jooray
requires_env:
- name: SIMPLEX_WS_URL
  description: simplex-chat 守护进程的 WebSocket URL (例如 ws://127.0.0.1:5225)
  prompt: SimpleX daemon WebSocket URL
  password: false
optional_env:
- name: SIMPLEX_ALLOWED_USERS
  description: 允许与机器人对话的逗号分隔的 SimpleX 联系人 ID
  prompt: Allowed contact IDs (comma-separated)
  password: false
- name: SIMPLEX_ALLOW_ALL_USERS
  description: 允许任何联系人与机器人对话 (仅开发模式 — 禁用白名单)
  prompt: Allow all contacts? (true/false)
  password: false
- name: SIMPLEX_AUTO_ACCEPT
  description: '自动接受传入的联系人请求 (默认: true)'
  prompt: Auto-accept contact requests? (true/false)
  password: false
- name: SIMPLEX_GROUP_ALLOWED
  description: Comma-separated SimpleX group IDs the bot should participate in, or
    '*' to allow any group. Omit to ignore group messages entirely (safer default
    — a bot in a group otherwise processes every member's traffic).
  prompt: Allowed group IDs (comma-separated, or '*' for any)
  password: false
- name: SIMPLEX_HOME_CHANNEL
  description: 定时任务/通知投递的默认联系人/群组 ID
  prompt: Home channel contact/group ID (or empty)
  password: false
- name: SIMPLEX_HOME_CHANNEL_NAME
  description: 主频道的友好名称 (defaults to the ID)
  prompt: Home channel display name (or empty)
  password: false
- name: HERMES_SIMPLEX_TEXT_BATCH_DELAY
  description: 'Quiet-period seconds (default: 0.8) used to concatenate rapid-fire
    inbound text messages into a single MessageEvent — same pattern as Telegram''s
    text batching.'
  prompt: Text batch flush delay in seconds (default 0.8)
  password: false
