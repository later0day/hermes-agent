name: teams-platform
label: Microsoft Teams
kind: platform
version: 1.0.0
description: Hermes Agent 的 Microsoft Teams 网关适配器。通过 Bot Framework 连接到 Microsoft Teams，在 Teams 聊天（个人私信、群组聊天、频道帖子）与 Hermes 代理之间中继消息。支持 Adaptive Card 审批提示。
author: Aamir Jawaid
# ``requires_env`` entries are surfaced in ``hermes config`` UI via the
# platform-plugin env var injector in ``hermes_cli/config.py``.
requires_env:
  - name: TEAMS_CLIENT_ID
    description: "Azure AD 应用（Bot Framework）客户端 ID"
    prompt: "Teams / Azure AD 客户端 ID"
    url: "https://portal.azure.com/"
    password: false
  - name: TEAMS_CLIENT_SECRET
    description: "Azure AD 应用客户端密钥"
    prompt: "Teams / Azure AD 客户端密钥"
    url: "https://portal.azure.com/"
    password: true
  - name: TEAMS_TENANT_ID
    description: "托管机器人应用的 Azure AD 租户 ID"
    prompt: "Teams / Azure AD 租户 ID"
    password: false
optional_env:
  - name: TEAMS_PORT
    description: "Webhook 监听端口（Bot Framework 默认：3978）"
    prompt: "Webhook 端口"
    password: false
  - name: TEAMS_HOST
    description: "Webhook 绑定主机（默认：未设置 → 双栈，所有 IPv4+IPv6 接口）"
    prompt: "Webhook 主机"
    password: false
  - name: TEAMS_ALLOWED_USERS
    description: "允许与机器人对话的 Teams 用户 ID / UPN 列表（逗号分隔）"
    prompt: "允许的用户（逗号分隔）"
    password: false
  - name: TEAMS_ALLOW_ALL_USERS
    description: "允许任何 Teams 用户触发机器人（仅用于开发）"
    prompt: "允许所有用户？(true/false)"
    password: false
  - name: TEAMS_REQUIRE_MENTION
    description: "仅响应 @提及机器人或回复机器人的频道/群聊消息（默认 false；应用获得 RSC 消息读取授权后需要开启）"
    prompt: "频道和群聊中要求 @提及？(true/false)"
    password: false
  - name: TEAMS_HOME_CHANNEL
    description: "cron / 通知投递的默认聊天/频道 ID"
    prompt: "主频道（或留空）"
    password: false
  - name: TEAMS_HOME_CHANNEL_NAME
    description: "Teams 主频道的显示名称"
    prompt: "主频道显示名称"
    password: false
  - name: TEAMS_INCOMING_WEBHOOK_URL
    description: "Incoming-webhook URL for meeting-summary delivery in webhook mode (the URL is the credential)"
    prompt: "Incoming webhook URL (or empty)"
    password: true
  - name: TEAMS_GRAPH_ACCESS_TOKEN
    description: "Microsoft Graph access token for meeting-summary delivery in graph mode"
    prompt: "Graph access token (or empty)"
    password: true
