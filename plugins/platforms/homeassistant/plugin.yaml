name: homeassistant-platform
label: Home Assistant
kind: platform
version: 1.0.0
description: Hermes Agent 的 Home Assistant 网关适配器。订阅 HA 的 WebSocket 事件总线并将状态更改事件（带有每个实体的冷却时间和域/实体过滤）转发给代理。出站消息通过
  REST API 作为 HA 持久通知传递。还支持通过 notify.notify 服务进行跨进程定时任务投递。
author: NousResearch
requires_env:
- name: HASS_TOKEN
  description: Home Assistant 长期访问令牌
  prompt: Home Assistant 长期访问令牌
  password: true
optional_env:
- name: HASS_URL
  description: 'Home Assistant 基本 URL (默认: http://homeassistant.local:8123)'
  prompt: Home Assistant URL
  password: false
